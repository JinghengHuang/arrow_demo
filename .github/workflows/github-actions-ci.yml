name: Run Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          virtualenvs-create: true
          virtualenvs-in-project: false
          virtualenvs-path: ~/venv
          installer-parallel: true

      - name: Set up Poetry and install dependencies
        run: |
            sh ./scripts/envSetup.sh

      - name: Run tests
        run: |
            source /etc/profile.d/myenv.sh
            sh ./scripts/startAll.sh > /dev/null 2>&1 &
            sleep 60
            nc -zv 127.0.0.1 8000 8101 65432
            poetry run pytest --junitxml=junit.xml --timeout=180
            julia --project=src/service/optimization_service/julia tests/test_julia_lp.jl
            julia --project=src/service/optimization_service/julia tests/test_julia_qp.jl